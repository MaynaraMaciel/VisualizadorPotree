<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="Monumento_Beberibe" content="">
    <meta name="author" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Potree_Viewer_Beberibe</title>

    <link rel="stylesheet" type="text/css" href="./build/potree/potree.css">
    <link rel="stylesheet" type="text/css" href="./libs/jquery-ui/jquery-ui.min.css">
    <link rel="stylesheet" type="text/css" href="./libs/openlayers3/ol.css">
    <link rel="stylesheet" type="text/css" href="./libs/spectrum/spectrum.css">
    <link rel="stylesheet" type="text/css" href="./libs/jstree/themes/mixed/style.css">

    <style>
        #lg_ufc {
            position: absolute;
            right: 10px;
            top: 810px;
            z-index: 100;
        }

        #lg_geoce {
            position: absolute;
            right: 100px;
            top: 840px;
            z-index: 100;
        }
    </style>

</head>

<body>
    <script src="./libs/jquery/jquery-3.1.1.min.js"></script>
    <script src="./libs/spectrum/spectrum.js"></script>
    <script src="./libs/jquery-ui/jquery-ui.min.js"></script>

    <script src="./libs/other/BinaryHeap.js"></script>
    <script src="./libs/three.js/build/three.js"></script>
    <script src="./libs/tween/tween.min.js"></script>
    <script src="./libs/d3/d3.js"></script>
    <script src="./libs/proj4/proj4.js"></script>
    <script src="./build/potree/potree.js"></script>
    <script src="./libs/three.js/build/three.min.js"></script>
    <script src="./libs/openlayers3/ol.js"></script>
    <script src="./libs/i18next/i18next.js"></script>
    <script src="./libs/jstree/jstree.js"></script>
    <script src="./libs/plasio/js/laslaz.js"></script>

    <div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px;">
        <div id="potree_render_area"></div>
        <div id="potree_sidebar_container"></div>
    </div>

    <!-- Logo UFC e Laboratorio -->
    <div id="lg_ufc">
        <a rel="https://www.ufc.br/" target="_blank" title="Portal_UFC">
            <img src="./Logo/lg_ufc.png" width="80" height="100" alt="UFC" /></a>
    </div>
    <div id="lg_geoce">
        <a rel="https://geoce.ufc.br/pt/" target="_blank" title="GEOCE">
            <img src="./Logo/lg_geoce.png" width="100" height="55" alt="GEOCE" /></a>
    </div>

    <script type="module">

        window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));

        // viewer.setEDLEnabled(false);
        viewer.setFOV(60);
        viewer.setPointBudget(3_000_000);
        viewer.loadSettingsFromURL();
        viewer.setDescription(
            "MODELO DIGITAL DE NUVEM DE PONTOS DO MONUMENTO NATURAL DAS FALÉSIAS DE BEBERIBE."
        );

        viewer.loadGUI(() => {
            viewer.setLanguage("en");
            $("#menu_appearance").next().show();
            $("#menu_Scene").next().hide();
            $("#menu_clipping").next().show();
            viewer.toggleSidebar();
        });

        viewer.scene.addAnnotation([599110.608, 9540597.034, 27.373], {
            "cameraPosition": [599135.287, 9540616.727, 24.329],
            "cameraTarget": [599102.643, 9540588.741, 11.001],
            "title": "FALÉSIA VIVA",
            "description": `
                <div style="text-align: justify; ">
                    <p>
                        Representa a ativa dinâmica costeira da região com a presença de blocos que desprenderam da falésia e caíram próximo a base. 
                        No entorno também podem ser vistas ruínas de uma antiga casa construída sobre a Unidade de Conservação. 
                        É considerado um ambiente instável, por isso, recomenda-se manter um distanciamento da feição.
                        </p>
                    <img src="./Logo/falesia.jpg" 
                         alt="Falésia"
                         style="display: block;
                         max-width: 80%;
                         border-radius: 10px;">
                </div>
                `
        });
        viewer.scene.addAnnotation([599054.935, 9540449.748, 43.954], {
            "cameraPosition": [599052.450, 9540448.547, 44.084],
            "cameraTarget": [599079.786, 9540461.760, 31.656],
            "title": "LABIRINTO",
            "description": `
                <div style="text-align: justify; ">
                    <p>
                        A Trilha do Labirinto é realizada entre as falésias, onde podem ser observadas rochas sedimentares, dunas e fontes de água.
                        É necessário atenção ao percorre- la, evitando estar muito próximo a base das falésia.
                        É proibido vandalizar as falésias, rabiscando e / ou desenhando gravuras.
                        </p>
                    <img src="./Logo/labirinto.jpg" 
                         alt="Labirinto"
                         style="display: block;
                         max-width: 70%;
                         border-radius: 10px;">
                </div>
                `
        });
        viewer.scene.addAnnotation([600696.582, 9539065.750, 20.246], {
            "cameraPosition": [600703.971, 9539055.826, 19.003],
            "cameraTarget": [600696.582, 9539065.750, 17.246],
            "title": "TRONO",
            "description": `
                <div style="text-align: justify; ">
                    <p>
                        O local possui um réplica do trono da famosa série americana Game of Thrones, situado entre voçorocas e ravinas. 
                        Recomenda-se ficar longe das bordas das falésias a fim de evitar acidentes, pois são locais instáveis.
                        </p>
                    <img src="./Logo/trono.webp" 
                         alt="Trono Série Game of Thrones"
                         style="display: block;
                         max-width: 50%;
                         border-radius: 10px;
                         opacity: none";>
                </div>
            `});

        Potree.loadPointCloud("./falesia_potree/cloud.js", "Falésia", e => {
            let scene = viewer.scene;
            let pointcloud = e.pointcloud;
            let material = pointcloud.material;
            material.size = 1;
            material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
            material.shape = Potree.PointShape.CIRCLE;

            scene.view.position.set(599396.001, 9540500.630, 110.841);
            scene.view.lookAt(599240.637, 9540506.457, 17.331);
            scene.addPointCloud(pointcloud);
            // viewer.fitToScreen();
        });

        Potree.loadPointCloud("./TEST_FRENTE_FALESIA/cloud.js", "Frente Falésia", e => {
            viewer.scene.addPointCloud(e.pointcloud);
            let pointcloud = e.pointcloud;
            let material = e.pointcloud.material;
            material.size = 0.25;
            material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
            material.shape = Potree.PointShape.SQUARE;
            material.activeAttributeName = "rgba";

            // Inverte a posição de renderização da nuvem de pontos
            //  pointcloud.position.z *= -1;
            //  pointcloud.scale.set(1, 1, -1);

            // Rendiza a nuvem de pontos na posição desejada
            scene.addPointCloud(pointcloud);
            scene.view.position.set(599386.433, 9540513.535, 115.608);
            scene.view.lookAt(599210.690, 9540511.620, 44.296);
            // scene.view.position.set(35.505, -3322.577, 6356911.694);
            // scene.view.lookAt(-10.260, -3336.031, 6356889.997);
        });

    </script>
</body>

</html>
